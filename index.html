<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MaMa MTZK lover</title>
    <style>
        body {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .container {
            background: rgba(255, 255, 255, 0.95);
            padding: 25px 20px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(255, 105, 180, 0.3);
            width: 85%;
            max-width: 320px;
            text-align: center;
            position: relative;
            min-height: 380px;
            box-sizing: border-box;
            border: 2px solid #ffb6c1;
        }
        .step-card {
            display: none;
            width: 100%;
        }
        .step-card.active {
            display: block;
        }
        .heart-icon {
            font-size: 80px;
            color: #ff4081;
            cursor: pointer;
            margin: 30px 0;
            display: inline-block;
            transition: transform 0.2s;
            animation: pulse 1.2s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.15); }
            100% { transform: scale(1); }
        }
        .sticker {
            width: 130px;
            height: 130px;
            object-fit: contain;
            margin: 15px 0;
            border-radius: 15px;
        }
        .btn-group {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-top: 20px;
            position: relative;
            min-height: 60px;
        }
        .btn {
            padding: 10px 18px;
            border-radius: 20px;
            border: none;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn-green {
            background-color: #ff4081;
            color: white;
            box-shadow: 0 4px 15px rgba(255, 64, 129, 0.4);
        }
        .btn-lightgreen {
            background-color: #ff80ab;
            color: white;
        }
        .full-screen-green {
            background: linear-gradient(135deg, #ff4081 0%, #ff758c 100%);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 280px;
            border-radius: 15px;
            font-size: 32px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 64, 129, 0.4);
        }
        .agreement-title {
            color: #d81b60;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
        }
        .agreement-list {
            text-align: left;
            font-size: 12px;
            padding: 0;
            list-style: none;
        }
        .agreement-list li {
            margin: 10px 0;
            padding-bottom: 5px;
            border-bottom: 1px dashed #ffb6c1;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .ans-tag {
            background-color: #ffe4e1;
            color: #d81b60;
            padding: 2px 6px;
            border-radius: 8px;
            font-size: 10px;
            font-weight: bold;
        }
        .btn-save {
            background-color: #ff4081;
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            border: none;
            font-weight: bold;
            margin-top: 15px;
            width: 100%;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 64, 129, 0.4);
        }
    </style>
</head>
<body>

            <p style="color: #e91e63; font-size: 12px; margin-top: 0;">Click The Heart</p>
